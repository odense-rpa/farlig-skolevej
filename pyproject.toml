[project]
name = "farlig-skolevej"
version = "0.4.0"
description = "RPA-robot der behandler ansøgninger om befordring på farlig skolevej fra XFlow og opdaterer med indskrivningssager fra SBSYS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "kmd-nexus-client",
    "odk-tools",
    "rapidfuzz>=3.14.5",
    "sbsys",
    "xflow-client",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.4.0" }
odk-tools = { git = "https://github.com/odense-rpa/odk-tools.git" }
xflow-client = { git = "https://github.com/odense-rpa/xflow-client.git" }
kmd-nexus-client = { git = "https://github.com/odense-rpa/nexus-client.git", rev = "a93da4866c98bc6e8605989359b2db69f8bb5bdb" }
sbsys = { git = "https://github.com/odense-rpa/sbsys-ng.git" }
